<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 5px; }
    details { margin-bottom: 16px; }
    summary { cursor: pointer; width: fit-content; }
    form { display: grid; gap: 8px; max-width: 360px; margin-top: 12px; }
    label { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    input, button { font: inherit; }
    input[type=number] { width: 100px; }
    button { width: fit-content; }
  </style>
</head>
<body>
  <details id="settings">
    <summary>settings</summary>
    <form id="form">
      <label>capture enabled <input name="CAPTURE_ENABLED" type="checkbox"></label>
      <label>minimum interval (seconds) <input name="MIN_CAPTURE_INTERVAL" type="number" min="0.001" max="86400" step="any" required></label>
      <label>maximum interval (seconds) <input name="MAX_CAPTURE_INTERVAL" type="number" min="0.001" max="86400" step="any" required></label>
      <label>detection interval (seconds) <input name="DETECTION_INTERVAL" type="number" min="0.001" max="86400" step="any" required></label>
      <label>person confidence <input name="PERSON_CONFIDENCE" type="number" min="0" max="1" step="any" required></label>
      <label>empty timeout (seconds) <input name="EMPTY_TIMEOUT" type="number" min="0" max="86400" step="any" required></label>
      <button type="submit" disabled>save</button>
    </form>
    <p id="status" role="status"></p>
  </details>
  <main class="gallery">{{photos}}</main>
  <script>
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const button = form.querySelector('button');
    document.getElementById('settings').addEventListener('toggle', async event => {
      if (!event.target.open) return;
      button.disabled = true;
      try {
        const response = await fetch('/settings');
        if (!response.ok) throw new Error('Unable to load settings');
        const settings = await response.json();
        for (const [key, value] of Object.entries(settings)) {
          const input = form.elements.namedItem(key);
          if (input.type === 'checkbox') input.checked = value;
          else input.value = value;
        }
        status.textContent = '';
        button.disabled = false;
      } catch (error) { status.textContent = error.message; }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      const settings = {};
      for (const input of form.querySelectorAll('input')) {
        settings[input.name] = input.type === 'checkbox' ? input.checked : Number(input.value);
      }
      try {
        const response = await fetch('/settings', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(settings)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to save settings');
        status.textContent = 'saved';
      } catch (error) { status.textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
